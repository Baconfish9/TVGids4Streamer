name: APK bouwen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bouwen
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: APK hernoemen
        run: cp app/build/outputs/apk/release/app-release.apk TVGids.apk

      - name: APK bewaren als artifact
        uses: actions/upload-artifact@v4
        with:
          name: TVGids-apk
          path: TVGids.apk

      - name: APK publiceren als release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TV Gids (laatste build)
          files: TVGids.apk
          make_latest: true
