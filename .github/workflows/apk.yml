name: APK bouwen

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Bestanden in de repository tonen
        run: find . -not -path './.git/*' -type f | sort

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: APK bouwen
        run: |
          INST=$(find . -name settings.gradle.kts -not -path './.git/*' | head -1)
          if [ -z "$INST" ]; then
            echo "FOUT: settings.gradle.kts niet gevonden. Upload de volledige inhoud van de zip."
            exit 1
          fi
          cd "$(dirname "$INST")"
          echo "Project gevonden in: $(pwd)"
          gradle assembleRelease --no-daemon --stacktrace

      - name: APK klaarzetten
        run: cp "$(find . -name app-release.apk | head -1)" TVGids.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TVGids-apk
          path: TVGids.apk

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: TV Gids (laatste build)
          files: TVGids.apk
          make_latest: true
